[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isonapse-hook-adk"
version = "1.1.0"
description = "Native host callbacks and bounded Isonapse Hook Protocol v1 transport"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isonapse_hook_adk = ["py.typed"]
